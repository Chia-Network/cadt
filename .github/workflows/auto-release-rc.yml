# Compares the version in package.json to tags on the repo. If the tag doesn't exist, a new tag is created, which
# then triggers the normal "on tag" release automation in the build job
name: Auto Tag RC

on:
  push:
    branches:
      - develop

concurrency:
  group: rc-release-check

jobs:
  release-dev:
    name: Release rc version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v6
        with:
          # Need REPO_COMMIT token so when the tag is created, the tag automation runs
          token: ${{ secrets.REPO_COMMIT }}
          fetch-depth: 0

      - name: Setup commit signing for ChiaAutomation
        uses: Chia-Network/actions/commit-sign/gpg@main
        with:
          gpg_private_key: ${{ secrets.CHIA_AUTOMATION_PRIVATE_GPG_KEY }}
          passphrase: ${{ secrets.CHIA_AUTOMATION_PRIVATE_GPG_PASSPHRASE }}

      - name: Check for current version tag. Create if it doesn't exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          stable_version=$(gh release list --limit 1 --order desc --exclude-pre-releases --json tagName --jq ".[].tagName")
          echo "Latest stable release is $stable_version"

          # Extract the major, minor, and patch versions
          IFS='.' read -r major minor patch <<< "$stable_version"

          # Increment the patch version
          new_patch=$((patch + 1))

          new_version="$major.$minor.$new_patch"
          echo "Looking for RC releases for version $new_version"

          # Get all RC releases for this version and find the highest RC number
          # Use proper regex escaping for dots and match rc followed by digits
          escaped_version=$(echo "$new_version" | sed 's/\./\\./g')
          rc_releases=$(gh release list --json tagName --jq "[.[] | select(.tagName | test(\"^${escaped_version}-rc[0-9]+$\")) | .tagName] | .[]")

          echo "Found RC releases:"
          echo "$rc_releases"

          if [[ -z ${rc_releases} ]]; then
            # No existing RC releases, start at rc1
            version="${new_version}-rc1"
            echo "No existing RC releases found. New version: $version"
          else
            # Find the highest RC number from all matching releases
            highest_rc=$(echo "$rc_releases" | grep -oP "rc\K[0-9]+" | sort -n | tail -1)
            echo "Highest existing RC number: $highest_rc"

            # Increment the RC number
            rc_number=$((highest_rc + 1))
            version="${new_version}-rc${rc_number}"
            echo "New version: $version"
          fi

          # Check if this tag already exists
          if [ $(git tag -l "$version") ]; then
            echo "Tag $version already exists."
            # Check if a release exists for this tag
            if gh release view "$version" > /dev/null 2>&1; then
              echo "Release also exists. Nothing to do."
              exit 0
            else
              echo "Tag exists but release does not. Deleting orphaned tag and recreating..."
              git tag -d $version
              git push --delete origin $version
            fi
          fi

          echo "Creating and pushing tag $version"
          rm -f CHANGELOG.md
          npx conventional-changelog-cli -p angular -i CHANGELOG.md -s -r 0
          changes=$(npx conventional-changelog-cli -r 1 | tail -n +2)
          git tag $version -m "Release $version  $changes"
          git push origin $version
