          echo "########################################################"
          # Run pre-flight check - requires both V1 and V2 for upgrade
          npm run preflight-check:v1v2 || {
            echo ""
            echo "########################################################"
            echo "PRE-FLIGHT CHECK FAILED - Showing additional debug info:"
            echo "########################################################"
            pm2 list || true
            pm2 logs cadt --lines 100 --nostream || true
            cat ~/.chia/mainnet/cadt/config.yaml || true
            exit 1
          }

      - name: V1 to V2 upgrade test
