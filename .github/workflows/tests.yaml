            ERRORS=$((ERRORS + 1))
          fi

          echo "--- pickList ---"
          PICK_LIST=$(curl -s http://127.0.0.1:31310/v2/governance/meta/pickList)
          PICK_VALID=$(echo "$PICK_LIST" | jq 'if type == "object" and (keys | length) > 0 then true else false end')
          if [ "$PICK_VALID" = "true" ]; then
            echo "PASS: pickList exists and is non-empty"
          else
            echo "FAIL: pickList is empty or invalid"
            ERRORS=$((ERRORS + 1))
          fi

          echo "--- glossary ---"
          GLOSSARY=$(curl -s http://127.0.0.1:31310/v2/governance/meta/glossary)
          GLOSSARY_VALID=$(echo "$GLOSSARY" | jq 'if type == "object" and (keys | length) > 0 then true else false end')
          if [ "$GLOSSARY_VALID" = "true" ]; then
            echo "PASS: glossary exists and is non-empty"
          else
            echo "FAIL: glossary is empty or invalid"
            ERRORS=$((ERRORS + 1))
          fi

          if [ "$ERRORS" -gt 0 ]; then
