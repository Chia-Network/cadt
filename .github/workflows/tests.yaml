          ORG_LIST=$(curl -s http://127.0.0.1:31310/v2/governance/meta/orgList)
          ORG_COUNT=$(echo "$ORG_LIST" | jq 'if type == "array" then length else 0 end')
          if [ "$ORG_COUNT" -gt 0 ]; then
