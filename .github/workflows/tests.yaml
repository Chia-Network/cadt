          fi
          echo "All governance data checks passed"

      - name: Wait for organization sync
        shell: bash
        run: |
          echo "Waiting for organizations from governance to sync..."
          MAX_WAIT_MINUTES=20
          WAIT_SECONDS=$((MAX_WAIT_MINUTES * 60))
          START_TIME=$(date +%s)

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            REMAINING=$((WAIT_SECONDS - ELAPSED))

            if [ "$REMAINING" -le 0 ]; then
              echo "ERROR: Reached maximum wait time of $MAX_WAIT_MINUTES minutes"
              echo "Organizations did not finish syncing"
              exit 1
            fi

            ORG_DATA=$(curl -s http://127.0.0.1:31310/v2/organizations 2>/dev/null || echo "{}")
            ALL_SYNCED=true
            ORG_COUNT=0

            for ORG_UID in $(echo "$ORG_DATA" | jq -r 'keys[]' 2>/dev/null); do
              ORG_COUNT=$((ORG_COUNT + 1))
              SYNCED=$(echo "$ORG_DATA" | jq -r ".\"${ORG_UID}\".synced // false")
              SYNC_REMAINING=$(echo "$ORG_DATA" | jq -r ".\"${ORG_UID}\".sync_remaining // -1")
              ORG_NAME=$(echo "$ORG_DATA" | jq -r ".\"${ORG_UID}\".name // \"unknown\"")

              echo "  Org $ORG_NAME: synced=$SYNCED, sync_remaining=$SYNC_REMAINING"

              if [ "$SYNCED" != "true" ] || [ "$SYNC_REMAINING" != "0" ]; then
                ALL_SYNCED=false
              fi
            done

            echo "Organizations found: $ORG_COUNT, all_synced=$ALL_SYNCED (elapsed: ${ELAPSED}s, remaining: ${REMAINING}s)"

            if [ "$ORG_COUNT" -gt 0 ] && [ "$ALL_SYNCED" = "true" ]; then
