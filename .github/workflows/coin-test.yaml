name: Coin Splitting Debug Test

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  test-coin-splitting:
    name: coin splitting debug
    runs-on: ubuntu-latest
    container:
      image: node:20.16

    steps:
      - uses: Chia-Network/actions/clean-workspace@main

      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Ignore Husky
        run: npm pkg delete scripts.prepare

      - name: npm install
        run: npm install

      - name: install global packages
        run: npm i -g @babel/cli sequelize-cli cross-env pm2@latest

      - name: Install yq and jq
        run: |
          apt-get update
          apt-get install -y yq jq bc iproute2

      - name: Install Chia and chia-tools
        shell: bash
        run: |
          curl -sL https://repo.chia.net/FD39E6D3.pubkey.asc | gpg --dearmor -o /usr/share/keyrings/chia.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/chia.gpg] https://repo.chia.net/debian/ stable main" | tee /etc/apt/sources.list.d/chia.list > /dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/chia.gpg] https://repo.chia.net/chia-tools/debian/ stable main" | tee /etc/apt/sources.list.d/chia-tools.list > /dev/null
          apt-get update
          apt-get install -y chia-blockchain-cli chia-tools

      - name: Configure Chia
        shell: bash
        run: |
          chia init
          chia keys generate -l "coin_split_test"
          chia-tools network switch testneta
          chia-tools config add-trusted-peer -y testneta-node-msp.chia.net 58444
          # Use DEBUG level for maximum visibility
          chia configure -log-level DEBUG

      - name: Start Chia services
        shell: bash
        run: |
          echo "========================================"
          echo "STARTING CHIA SERVICES"
          echo "========================================"
          chia start wallet data data_layer_http
          sleep 15
          echo ""
          echo "Initial Chia log (last 50 lines):"
          tail -50 ~/.chia/mainnet/log/debug.log || true

      - name: Get funds from faucet
        shell: bash
        run: |
          echo "========================================"
          echo "STEP 1: GETTING FUNDS FROM FAUCET"
          echo "========================================"
          CHIA_WALLET_ADDRESS=$(chia wallet get_address)
          echo "Wallet address: $CHIA_WALLET_ADDRESS"
          echo ""
          echo "Requesting 0.00001 XCH (10,000,000 mojos) from faucet..."
          curl -X POST -H "Content-Type: application/json" -d '{"address":"'"$CHIA_WALLET_ADDRESS"'","amount":0.00001}' "${{ secrets.TESTNETA_FAUCET }}"
          echo ""
          echo ""
          echo "Waiting for wallet to receive funds..."
          MAX_ATTEMPTS=60
          ATTEMPT=0
          while true; do
            BALANCE=$(chia rpc wallet get_wallet_balance '{"wallet_id": 1}' | jq -r '.wallet_balance.confirmed_wallet_balance')
            echo "Current balance: $BALANCE mojos (attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)"
            if [ "$BALANCE" != "0" ] && [ "$BALANCE" != "null" ] && [ -n "$BALANCE" ]; then
              XCH_BALANCE=$(echo "scale=12; $BALANCE / 1000000000000" | bc)
              echo ""
              echo "✓ Wallet funded! Balance: $BALANCE mojos ($XCH_BALANCE XCH)"
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "ERROR: Timeout waiting for wallet to be funded after 10 minutes"
              exit 1
            fi
            sleep 10
          done

      - name: Wait for wallet synced=true
        shell: bash
        run: |
          echo "========================================"
          echo "STEP 2: WAITING FOR WALLET synced=true"
          echo "========================================"
          echo "NOTE: Only checking synced=true (syncing flag may stay true indefinitely)"
          echo ""
          MAX_WAIT_MINUTES=5
          WAIT_SECONDS=$((MAX_WAIT_MINUTES * 60))
          START_TIME=$(date +%s)

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            REMAINING=$((WAIT_SECONDS - ELAPSED))

            if [ "$REMAINING" -le 0 ]; then
              echo ""
              echo "========================================"
              echo "ERROR: Wallet synced != true after $MAX_WAIT_MINUTES minutes!"
              echo "========================================"
              chia rpc wallet get_sync_status || true
              exit 1
            fi

            WALLET_STATUS=$(chia rpc wallet get_sync_status 2>/dev/null || echo '{"synced": false}')
            WALLET_SYNCED=$(echo "$WALLET_STATUS" | jq -r '.synced // false')
            WALLET_SYNCING=$(echo "$WALLET_STATUS" | jq -r '.syncing // true')

            echo "Wallet status: synced=$WALLET_SYNCED, syncing=$WALLET_SYNCING (elapsed: ${ELAPSED}s)"

            # Only require synced=true, ignore syncing flag
            if [ "$WALLET_SYNCED" = "true" ]; then
              echo ""
              echo "✓ Wallet synced=true! Proceeding to test transaction capability."
              break
            fi

            sleep 10
          done

      - name: Test wallet transaction capability (simple split)
        shell: bash
        run: |
          echo "========================================"
          echo "STEP 2b: TEST WALLET CAN DO TRANSACTIONS"
          echo "========================================"
          echo "Testing if wallet can perform transactions with synced=true (even if syncing=true)"
          echo ""
          
          # Get current wallet status
          echo "Current wallet status:"
          chia rpc wallet get_sync_status
          echo ""
          
          # Get coin records to find a coin to split
          echo "Getting coin records..."
          COINS=$(chia rpc wallet get_coin_records '{"wallet_id": 1}')
          echo "$COINS" | jq '.'
          
          # Find an unspent coin
          ORIGINAL_COIN=$(echo "$COINS" | jq -r '.coin_records[] | select(.spent_height == 0) | .id' | head -1)
          COIN_AMOUNT=$(echo "$COINS" | jq -r ".coin_records[] | select(.id == \"$ORIGINAL_COIN\") | .amount")
          
          echo ""
          echo "Found unspent coin: $ORIGINAL_COIN"
          echo "Coin amount: $COIN_AMOUNT mojos"
          
          if [ -z "$ORIGINAL_COIN" ] || [ "$ORIGINAL_COIN" = "null" ]; then
            echo "ERROR: No unspent coin found!"
            exit 1
          fi
          
          # Try a simple split: split into 2 coins of 10000 mojos each
          echo ""
          echo "========================================"
          echo "ATTEMPTING SIMPLE COIN SPLIT"
          echo "========================================"
          echo "Splitting coin $ORIGINAL_COIN into 2 coins of 10000 mojos each (fee: 1000 mojos)"
          echo ""
          
          SPLIT_RESULT=$(chia rpc wallet split_coins "{\"wallet_id\": 1, \"target_coin_id\": \"$ORIGINAL_COIN\", \"number_of_coins\": 2, \"amount_per_coin\": 10000, \"fee\": 1000}" 2>&1)
          SPLIT_EXIT_CODE=$?
          
          echo "Split RPC response:"
          echo "$SPLIT_RESULT"
          echo ""
          echo "Exit code: $SPLIT_EXIT_CODE"
          
          # Check if split was accepted
          SPLIT_SUCCESS=$(echo "$SPLIT_RESULT" | jq -r '.success // false' 2>/dev/null || echo "false")
          
          if [ "$SPLIT_SUCCESS" != "true" ]; then
            echo ""
            echo "========================================"
            echo "✗ SPLIT TRANSACTION REJECTED"
            echo "========================================"
            echo "The wallet rejected the split transaction."
            if echo "$SPLIT_RESULT" | grep -qi "sync"; then
              echo "The error mentions 'sync' - wallet may need syncing=false after all."
            fi
            exit 1
          fi
          
          echo ""
          echo "Split transaction accepted by wallet. Now waiting for confirmation..."
          echo ""
          
          # Wait for the split to confirm (original coin spent + new coins appear)
          echo "========================================"
          echo "WAITING FOR SPLIT CONFIRMATION"
          echo "========================================"
          echo "Will check every 30 seconds with full debug output"
          echo ""
          MAX_WAIT_SECONDS=600  # 10 minutes
          START_TIME=$(date +%s)
          CHECK_NUM=0
          
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            CHECK_NUM=$((CHECK_NUM + 1))
            
            echo ""
            echo "========================================"
            echo "CHECK #${CHECK_NUM} at ${ELAPSED}s"
            echo "========================================"
            
            if [ "$ELAPSED" -ge "$MAX_WAIT_SECONDS" ]; then
              echo ""
              echo "========================================"
              echo "✗ TIMEOUT: Split not confirmed after ${MAX_WAIT_SECONDS}s"
              echo "========================================"
              echo "Final coin state:"
              chia rpc wallet get_coin_records '{"wallet_id": 1}' | jq '.coin_records[] | select(.spent_height == 0) | {id: .id, amount: .amount}'
              exit 1
            fi
            
            # Get current wallet sync status
            echo ""
            echo "--- Wallet Sync Status ---"
            chia rpc wallet get_sync_status
            
            # Get and display ALL coin records (raw JSON)
            echo ""
            echo "--- RAW Coin Records JSON ---"
            CURRENT_COINS=$(chia rpc wallet get_coin_records '{"wallet_id": 1}')
            echo "$CURRENT_COINS" | jq '.'
            
            # Show coin count breakdown
            echo ""
            echo "--- Coin Analysis ---"
            TOTAL_COINS=$(echo "$CURRENT_COINS" | jq '.coin_records | length')
            UNSPENT_COUNT=$(echo "$CURRENT_COINS" | jq '[.coin_records[] | select(.spent_height == 0)] | length')
            SPENT_COUNT=$(echo "$CURRENT_COINS" | jq '[.coin_records[] | select(.spent_height != 0)] | length')
            echo "Total coin records: $TOTAL_COINS"
            echo "Unspent coins (spent_height == 0): $UNSPENT_COUNT"
            echo "Spent coins (spent_height != 0): $SPENT_COUNT"
            
            # Show each unspent coin with its amount
            echo ""
            echo "--- Unspent Coins Detail ---"
            echo "$CURRENT_COINS" | jq '.coin_records[] | select(.spent_height == 0) | {id: .id, amount: .amount, spent_height: .spent_height}'
            
            # Check original coin status
            echo ""
            echo "--- Original Coin Status ---"
            echo "Looking for original coin: $ORIGINAL_COIN"
            ORIGINAL_COIN_INFO=$(echo "$CURRENT_COINS" | jq ".coin_records[] | select(.id == \"$ORIGINAL_COIN\")")
            if [ -n "$ORIGINAL_COIN_INFO" ] && [ "$ORIGINAL_COIN_INFO" != "null" ]; then
              echo "Original coin found:"
              echo "$ORIGINAL_COIN_INFO" | jq '{id: .id, amount: .amount, spent_height: .spent_height}'
              ORIGINAL_SPENT_HEIGHT=$(echo "$ORIGINAL_COIN_INFO" | jq -r '.spent_height')
              if [ "$ORIGINAL_SPENT_HEIGHT" = "0" ]; then
                echo "Status: UNSPENT (spent_height=0)"
                ORIGINAL_STILL_UNSPENT="yes"
              else
                echo "Status: SPENT at height $ORIGINAL_SPENT_HEIGHT"
                ORIGINAL_STILL_UNSPENT=""
              fi
            else
              echo "Original coin NOT FOUND in coin records!"
              ORIGINAL_STILL_UNSPENT=""
            fi
            
            # Count usable coins
            echo ""
            echo "--- Usable Coins Count (amount >= 10000 mojos) ---"
            USABLE_COINS=$(echo "$CURRENT_COINS" | jq '[.coin_records[] | select(.spent_height == 0) | select(.amount >= 10000)] | length')
            echo "Usable coins count: $USABLE_COINS"
            echo "Coins that qualify:"
            echo "$CURRENT_COINS" | jq '[.coin_records[] | select(.spent_height == 0) | select(.amount >= 10000) | {id: .id, amount: .amount}]'
            
            # Get recent transactions
            echo ""
            echo "--- Last 5 Transactions ---"
            chia rpc wallet get_transactions '{"wallet_id": 1, "start": 0, "end": 5}' | jq '.transactions[] | {name: .name, confirmed: .confirmed, confirmed_at_height: .confirmed_at_height, amount: .amount, fee_amount: .fee_amount, type: .type, additions_count: (.additions | length), removals_count: (.removals | length)}'
            
            # Summary line
            echo ""
            echo "========================================"
            echo "SUMMARY: Original unspent: $([ -n \"$ORIGINAL_STILL_UNSPENT\" ] && echo 'YES' || echo 'NO'), Usable coins (>=10000): $USABLE_COINS"
            echo "========================================"
            
            # Success: original coin spent AND we have at least 2 usable coins
            if [ -z "$ORIGINAL_STILL_UNSPENT" ] && [ "$USABLE_COINS" -ge 2 ]; then
              echo ""
              echo "========================================"
              echo "✓ SPLIT CONFIRMED!"
              echo "========================================"
              echo "Original coin has been spent and $USABLE_COINS new usable coins are available."
              echo "This proves transactions CAN be confirmed with synced=true (syncing may be true)."
              break
            fi
            
            echo ""
            echo "Split not yet confirmed. Waiting 30 seconds before next check..."
            sleep 30
          done

      - name: Show wallet state BEFORE starting CADT
        shell: bash
        run: |
          echo "========================================"
          echo "STEP 3: WALLET STATE BEFORE CADT"
          echo "========================================"
          echo ""
          echo "--- Wallet Balance ---"
          chia wallet show
          echo ""
          echo "--- Wallet Sync Status ---"
          chia rpc wallet get_sync_status
          echo ""
          echo "--- All Coin Records ---"
          chia rpc wallet get_coin_records '{"wallet_id": 1}' | jq '.'
          echo ""
          echo "--- Coin Summary ---"
          COINS=$(chia rpc wallet get_coin_records '{"wallet_id": 1}')
          TOTAL_COINS=$(echo "$COINS" | jq '.coin_records | length')
          UNSPENT_COINS=$(echo "$COINS" | jq '[.coin_records[] | select(.spent_height == 0)] | length')
          LARGE_COINS=$(echo "$COINS" | jq '[.coin_records[] | select(.spent_height == 0) | select(.amount >= 10000)] | length')
          echo "Total coins: $TOTAL_COINS"
          echo "Unspent coins: $UNSPENT_COINS"
          echo "Unspent coins >= 10000 mojos: $LARGE_COINS"
          echo ""
          echo "--- Unspent Coins Detail ---"
          echo "$COINS" | jq '.coin_records[] | select(.spent_height == 0) | {id: .id, amount: .amount, confirmed_height: .confirmed_block_height}'
          echo ""
          echo "--- Recent Transactions ---"
          chia rpc wallet get_transactions '{"wallet_id": 1, "start": 0, "end": 10}' | jq '.transactions[] | {name: .name, confirmed: .confirmed, amount: .amount, type: .type}' || echo "No transactions yet"

      - name: Configure CADT
        shell: bash
        run: |
          echo "========================================"
          echo "STEP 4: CONFIGURE CADT"
          echo "========================================"

          # Create CADT config directory structure manually (without starting CADT)
          # This avoids triggering coin management during config setup
          mkdir -p ~/.chia/mainnet/cadt/v1
          mkdir -p ~/.chia/mainnet/cadt/v2

          # Create config file from scratch with all required settings
          # Using printf to avoid YAML parsing issues with heredoc
          printf '%s\n' \
            'APP:' \
            '  LOG_LEVEL: debug' \
            '  CHIA_NETWORK: testnet' \
            '  BIND_ADDRESS: 127.0.0.1' \
            '  DATALAYER_HOST: https://127.0.0.1:8562' \
            '  WALLET_HOST: https://127.0.0.1:9256' \
            '  DATALAYER_FILE_SERVER_URL: https://127.0.0.1:8575' \
            '  AUTO_MIRROR_EXTERNAL_STORES: true' \
            'V1:' \
            '  ENABLE: false' \
            '  GOVERNANCE:' \
            '    GOVERNANCE_BODY_ID: 29fe490bde0186cb7a592450d12e78162a353b866beec3e51bd67394257e4f4f' \
            'V2:' \
            '  ENABLE: true' \
            '  GOVERNANCE:' \
            '    GOVERNANCE_BODY_ID: 29fe490bde0186cb7a592450d12e78162a353b866beec3e51bd67394257e4f4f' \
            > ~/.chia/mainnet/cadt/config.yaml

          echo ""
          echo "CADT config.yaml:"
          cat ~/.chia/mainnet/cadt/config.yaml

      - name: Start CADT and wait for coin management
        shell: bash
        run: |
          echo "========================================"
          echo "STEP 5: START CADT"
          echo "========================================"
          echo ""
          echo "Starting CADT at $(date)..."
          pm2 start npm --no-autorestart --name "cadt" -- start

          echo ""
          echo "Waiting 60 seconds for CADT to run initial coin management..."
          sleep 60

          echo ""
          echo "--- CADT logs after 60 seconds ---"
          pm2 logs cadt --lines 300 --nostream

      - name: Check coin state at T+60s
        shell: bash
        run: |
          echo "========================================"
          echo "STEP 6: COIN STATE AT T+60 SECONDS"
          echo "========================================"
          echo ""
          echo "--- Wallet Balance ---"
          chia wallet show
          echo ""
          echo "--- Wallet Sync Status ---"
          chia rpc wallet get_sync_status
          echo ""
          echo "--- All Coin Records ---"
          COINS=$(chia rpc wallet get_coin_records '{"wallet_id": 1}')
          echo "$COINS" | jq '.'
          echo ""
          echo "--- Coin Summary ---"
          TOTAL_COINS=$(echo "$COINS" | jq '.coin_records | length')
          UNSPENT_COINS=$(echo "$COINS" | jq '[.coin_records[] | select(.spent_height == 0)] | length')
          LARGE_COINS=$(echo "$COINS" | jq '[.coin_records[] | select(.spent_height == 0) | select(.amount >= 10000)] | length')
          echo "Total coins: $TOTAL_COINS"
          echo "Unspent coins: $UNSPENT_COINS"
          echo "Unspent coins >= 10000 mojos: $LARGE_COINS"
          echo ""
          echo "--- Unspent Coins Detail ---"
          echo "$COINS" | jq '.coin_records[] | select(.spent_height == 0) | {id: .id, amount: .amount, confirmed_height: .confirmed_block_height}'
          echo ""
          echo "--- All Transactions ---"
          chia rpc wallet get_transactions '{"wallet_id": 1, "start": 0, "end": 30}' | jq '.transactions[] | {name: .name, confirmed: .confirmed, amount: .amount, type: .type, sent: .sent, created_at_time: .created_at_time}'

      - name: Wait for coin split confirmation (2 more minutes)
        shell: bash
        run: |
          echo "========================================"
          echo "STEP 7: WAITING 2 MORE MINUTES FOR SPLIT CONFIRMATION"
          echo "========================================"
          sleep 120

      - name: Check coin state at T+3 minutes
        shell: bash
        run: |
          echo "========================================"
          echo "STEP 8: COIN STATE AT T+3 MINUTES"
          echo "========================================"
          echo ""
          echo "--- Wallet Balance ---"
          chia wallet show
          echo ""
          echo "--- All Coin Records ---"
          COINS=$(chia rpc wallet get_coin_records '{"wallet_id": 1}')
          echo "$COINS" | jq '.'
          echo ""
          echo "--- Coin Summary ---"
          TOTAL_COINS=$(echo "$COINS" | jq '.coin_records | length')
          UNSPENT_COINS=$(echo "$COINS" | jq '[.coin_records[] | select(.spent_height == 0)] | length')
          LARGE_COINS=$(echo "$COINS" | jq '[.coin_records[] | select(.spent_height == 0) | select(.amount >= 10000)] | length')
          echo "Total coins: $TOTAL_COINS"
          echo "Unspent coins: $UNSPENT_COINS"
          echo "Unspent coins >= 10000 mojos: $LARGE_COINS"
          echo ""
          echo "--- Unspent Coins Detail ---"
          echo "$COINS" | jq '.coin_records[] | select(.spent_height == 0) | {id: .id, amount: .amount, confirmed_height: .confirmed_block_height}'
          echo ""
          echo "--- CADT logs (coin management related) ---"
          pm2 logs cadt --lines 100 --nostream | grep -i "coin" || echo "No coin-related logs found"

      - name: Wait 3 more minutes
        shell: bash
        run: |
          echo "========================================"
          echo "STEP 9: WAITING 3 MORE MINUTES"
          echo "========================================"
          sleep 180

      - name: Check coin state at T+6 minutes
        shell: bash
        run: |
          echo "========================================"
          echo "STEP 10: COIN STATE AT T+6 MINUTES"
          echo "========================================"
          echo ""
          echo "--- Wallet Balance ---"
          chia wallet show
          echo ""
          echo "--- All Coin Records ---"
          COINS=$(chia rpc wallet get_coin_records '{"wallet_id": 1}')
          echo "$COINS" | jq '.'
          echo ""
          echo "--- Coin Summary ---"
          TOTAL_COINS=$(echo "$COINS" | jq '.coin_records | length')
          UNSPENT_COINS=$(echo "$COINS" | jq '[.coin_records[] | select(.spent_height == 0)] | length')
          LARGE_COINS=$(echo "$COINS" | jq '[.coin_records[] | select(.spent_height == 0) | select(.amount >= 10000)] | length')
          echo "Total coins: $TOTAL_COINS"
          echo "Unspent coins: $UNSPENT_COINS"
          echo "Unspent coins >= 10000 mojos: $LARGE_COINS"
          echo ""
          echo "--- Unspent Coins Detail ---"
          echo "$COINS" | jq '.coin_records[] | select(.spent_height == 0) | {id: .id, amount: .amount, confirmed_height: .confirmed_block_height}'

      - name: Wait 4 more minutes (total T+10 minutes)
        shell: bash
        run: |
          echo "========================================"
          echo "STEP 11: WAITING 4 MORE MINUTES (T+10 TOTAL)"
          echo "========================================"
          sleep 240

      - name: Final coin state check (T+10 minutes)
        shell: bash
        run: |
          echo "========================================"
          echo "STEP 12: FINAL COIN STATE (T+10 MINUTES)"
          echo "========================================"
          echo ""
          echo "--- Wallet Balance ---"
          chia wallet show
          echo ""
          echo "--- Wallet Sync Status ---"
          chia rpc wallet get_sync_status
          echo ""
          echo "--- All Coin Records ---"
          COINS=$(chia rpc wallet get_coin_records '{"wallet_id": 1}')
          echo "$COINS" | jq '.'
          echo ""
          echo "========================================"
          echo "        COIN SPLITTING RESULT"
          echo "========================================"
          TOTAL_COINS=$(echo "$COINS" | jq '.coin_records | length')
          UNSPENT_COINS=$(echo "$COINS" | jq '[.coin_records[] | select(.spent_height == 0)] | length')
          LARGE_COINS=$(echo "$COINS" | jq '[.coin_records[] | select(.spent_height == 0) | select(.amount >= 10000)] | length')
          echo ""
          echo "Total coins in wallet: $TOTAL_COINS"
          echo "Unspent coins: $UNSPENT_COINS"
          echo "Unspent coins >= 10000 mojos (usable for DataLayer): $LARGE_COINS"
          echo ""
          if [ "$LARGE_COINS" -ge 4 ]; then
            echo "✓ SUCCESS: Have $LARGE_COINS coins >= 10000 mojos (need 4 for org creation)"
          else
            echo "✗ FAILURE: Only have $LARGE_COINS coins >= 10000 mojos (need 4 for org creation)"
          fi
          echo ""
          echo "--- Unspent Coins Detail ---"
          echo "$COINS" | jq '.coin_records[] | select(.spent_height == 0) | {id: .id, amount: .amount, confirmed_height: .confirmed_block_height}'
          echo ""
          echo "--- All Transactions (chronological) ---"
          chia rpc wallet get_transactions '{"wallet_id": 1, "start": 0, "end": 50}' | jq '.transactions | sort_by(.created_at_time) | .[] | {name: .name, confirmed: .confirmed, amount: .amount, type: .type, sent: .sent, created_at_time: .created_at_time, fee_amount: .fee_amount}'

      - name: Show full CADT logs
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "FULL CADT STDOUT LOGS"
          echo "========================================"
          cat ~/.pm2/logs/cadt-out.log || echo "No stdout log found"
          echo ""
          echo "========================================"
          echo "FULL CADT STDERR LOGS"
          echo "========================================"
          cat ~/.pm2/logs/cadt-error.log || echo "No stderr log found"

      - name: Show Chia debug log (filtered)
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "CHIA DEBUG LOG (filtered, last 5000 lines)"
          echo "========================================"
          echo "Filtering out noisy messages (connections, block headers, cache, keyring locks)..."
          echo ""
          tail -n 5000 ~/.chia/mainnet/log/debug.log 2>/dev/null | grep -v \
            -e "Connecting: wss://127.0.0.1" \
            -e "respond_block_headers from" \
            -e "Time for request request_block_headers" \
            -e "get_timestamp_for_height_from_peer add to cache" \
            -e "request_puzzle_solution to peer" \
            -e "acquired on.*keyring.yaml.lock" \
            -e "released on.*keyring.yaml.lock" \
            -e "request_header_blocks" \
            -e "coin_state_update" \
            -e "new_signage_point_or_end_of_sub_slot" \
            -e "request_removal_proof" \
            -e "RespondToCoinUpdates" \
            -e "register_interest_in_coin" \
            -e "request_children to peer" \
            -e "respond_to_coin_update" \
            -e "_coin_subscriptions" \
            -e "Getting generator for" \
            -e "SubscriptionConfig" \
            -e "sub epoch.*start weight is" \
            -e "Puzzle at index" \
            -e "Attempting to acquire lock" \
            -e "watchdog.observers.inotify_buffer" \
            -e "filelock" \
            || echo "No Chia debug log found or all lines filtered"

      - name: Show wallet transaction history
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "WALLET TRANSACTION HISTORY (DETAILED)"
          echo "========================================"
          chia rpc wallet get_transactions '{"wallet_id": 1, "start": 0, "end": 100}' | jq '.' || echo "Could not get transactions"

      - name: Stop all services
        if: always()
        shell: bash
        run: |
          pm2 stop cadt || true
          pm2 delete cadt || true
          chia stop all -d || true
