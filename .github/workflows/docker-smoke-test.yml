name: Docker Smoke Test

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - 'v2-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  docker-smoke-test:
    name: Docker smoke test (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t cadt-smoke-test .

      - name: Verify native modules load
        run: |
          docker run --rm --entrypoint node --workdir /app cadt-smoke-test \
            --input-type=commonjs -e \
            "require('sqlite3'); console.log('sqlite3 native module loaded OK')"

      - name: Verify container starts and health endpoints respond
        run: |
          trap 'docker rm -f cadt-test > /dev/null 2>&1 || true' EXIT

          docker run -d --name cadt-test \
            -e USE_SIMULATOR=true \
            -e BIND_ADDRESS=0.0.0.0 \
            -e DEFAULT_FEE=13 \
            -e DEFAULT_COIN_AMOUNT=7 \
            -p 31310:31310 \
            cadt-smoke-test

          for i in $(seq 1 60); do
            if docker logs cadt-test 2>&1 | grep -q "Server listening"; then
              echo "Server started successfully"
              break
            fi
            if ! docker ps -q --filter "name=cadt-test" | grep -q .; then
              echo "Container exited unexpectedly:"
              docker logs cadt-test 2>&1
              exit 1
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timeout waiting for server to start"
              docker logs cadt-test 2>&1
              exit 1
            fi
            sleep 1
          done

          echo "Testing health endpoints..."

          curl -sf http://localhost:31310/health | jq .
          curl -sf http://localhost:31310/v1/health | jq .
          curl -sf http://localhost:31310/v2/health | jq .

          echo "All health checks passed"

          # Numeric env vars must reach config.yaml as YAML numbers. Quoted
          # values make the app concatenate them instead of adding them.
          echo "Checking numeric config values are unquoted..."
          docker exec cadt-test cat /root/.chia/mainnet/cadt/config.yaml

          docker exec cadt-test \
            grep -qE '^[[:space:]]*DEFAULT_FEE: 13$' \
            /root/.chia/mainnet/cadt/config.yaml
          docker exec cadt-test \
            grep -qE '^[[:space:]]*DEFAULT_COIN_AMOUNT: 7$' \
            /root/.chia/mainnet/cadt/config.yaml

          echo "Numeric config values are unquoted"
