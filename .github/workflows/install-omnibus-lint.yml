name: Install Omnibus Lint

on:
  pull_request:
    paths:
      - 'tools/install-omnibus.sh'
      - 'tools/test/**'
      - '.github/workflows/install-omnibus-lint.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - 'tools/install-omnibus.sh'
      - 'tools/test/**'
      - '.github/workflows/install-omnibus-lint.yml'

permissions:
  contents: read

jobs:
  lint:
    name: shell lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: bash syntax check
        run: bash -n tools/install-omnibus.sh

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: shellcheck -x tools/install-omnibus.sh

      - name: shfmt
        uses: mfinelli/setup-shfmt@v3
        with:
          version: v3.10.0

      - name: shfmt check
        run: shfmt -d -i 2 -ci tools/install-omnibus.sh

  unit:
    name: bats unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install test dependencies
        # python3-yaml is required so patch_cadt_config bats tests don't skip.
        run: sudo apt-get update && sudo apt-get install -y bats jq python3-yaml

      - name: Run bats
        run: bats tools/test/test_install_omnibus.bats
