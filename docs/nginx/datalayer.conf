map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name _;

    # 1. DataLayer with 7-Day Caching
    location /data/ {
        alias /var/www/data_layer/;

        # Sets "Expires" and "Cache-Control: max-age=604800" (7 days)
        expires 7d;

        # "public" ensures downstream CDNs and proxies cache it, not just the browser
        add_header Cache-Control "public, no-transform";
    }

    # 2. Root path proxies everything else to CADT API at port 31310
    location / {
        proxy_pass http://localhost:31310;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
